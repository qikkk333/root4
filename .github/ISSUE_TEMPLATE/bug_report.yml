name: Bug Report
description: Report a bug, incorrect routing, formatting issue, or failing check in Railway Passenger Help Desk
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for reporting an issue! Please complete the fields below so maintainers can reproduce it reliably.
        **Never paste API keys, `.env` contents, or credentials in this form.**

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear summary of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the assistant, launcher, or test suite to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, menu selections, or passenger question used.
      value: |
        1. Run '...'
        2. Ask '...' or select option '...'
        3. Observe error
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Expected Python 3.12 (e.g., `python --version`).
      placeholder: "3.12.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows (PowerShell)
        - Windows (CMD)
        - Ubuntu / Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: errors_logs
    attributes:
      label: Error messages and relevant logs
      description: Paste traceback or terminal output (confirm all secrets/API keys are removed).
      render: shell

